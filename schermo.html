<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schermi sincronizzati</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; user-select: none; }
  .livello { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; visibility: hidden; }
  .livello.su { visibility: visible; }
  #nero { position: absolute; inset: 0; background: #000; visibility: hidden; }
  #nero.su { visibility: visible; }
  /* informazioni di servizio: si vedono solo con ?prova=1, mai davanti al pubblico */
  #prova { position: absolute; left: 1.5vw; bottom: 1.5vh; padding: .6vh 1vw; border-radius: .6vh;
           font: 600 2vh/1.3 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.65); display: none; }
</style>
</head>
<body>
<img id="a" class="livello" alt="">
<img id="b" class="livello" alt="">
<div id="nero"></div>
<div id="prova"></div>
<script src="rete.js"></script>
<script>
// Monitor di un palchetto: mostra la slide decisa dal telecomando, nello stesso istante degli altri schermi.
// Finché nessuno ha messo in onda una presentazione, lo schermo resta nero.
var PROVA = /[?&]prova=1/.test(location.search);
var stato = null, deck = null, sveglia = null, caricando = null;
var livelli = [document.getElementById('a'), document.getElementById('b')], sopra = 0, mostrata = -1;
var neroEl = document.getElementById('nero'), provaEl = document.getElementById('prova');
if (PROVA) provaEl.style.display = 'block';

function url(i) { return SLIDE.immagine(deck, 'm', i); }

// una presentazione nuova: tutte le slide scaricate subito, così al momento del cambio sono già in memoria
function caricaDeck(d) {
  var pronte = [];
  for (var i = 0; i < d.n; i++) {
    pronte.push(new Promise(function (ok) {
      var im = new Image(); im.onload = im.onerror = ok; im.src = SLIDE.immagine(d, 'm', i);
    }));
  }
  // si passa alla presentazione nuova appena è scaricata la prima slide; le altre arrivano intanto
  return pronte[0].then(function () {
    deck = d; mostrata = -1;
    livelli.forEach(function (l) { l.dataset.i = ''; });
  });
}

// prepara la slide i nel livello nascosto: quando arriva l'istante del cambio basta scambiare i livelli
function prepara(i) {
  if (!deck || i < 0 || i >= deck.n) return;
  var sotto = livelli[1 - sopra];
  if (sotto.dataset.i === String(i)) return;
  sotto.dataset.i = String(i); sotto.src = url(i);
  if (sotto.decode) sotto.decode().catch(function () {});
}

function mostra(i) {
  if (!deck || i === mostrata) return;
  var sotto = livelli[1 - sopra];
  if (sotto.dataset.i !== String(i)) { sotto.dataset.i = String(i); sotto.src = url(i); }
  sotto.classList.add('su'); livelli[sopra].classList.remove('su'); sopra = 1 - sopra;
  mostrata = i;
  prepara(Math.min(i + 1, deck.n - 1));
  vivo();
}

function aggiorna() {
  clearTimeout(sveglia);
  if (!stato || !stato.deck) { livelli.forEach(function (l) { l.classList.remove('su'); }); scriviProva(); return; }
  if (!deck || deck.id !== stato.deck.id) {          // presentazione cambiata: prima si scarica, poi si mostra
    var d = stato.deck;
    if (caricando === d.id) return;
    caricando = d.id;
    caricaDeck(d).then(function () { caricando = null; if (stato.deck && stato.deck.id === d.id) aggiorna(); });
    return;
  }
  var t = ora();
  mostra(SLIDE.indice(stato, t));
  neroEl.classList.toggle('su', SLIDE.nero(stato, t));
  var prossimo = SLIDE.prossimoCambio(stato, t);
  if (prossimo !== null) {
    prepara(SLIDE.indice(stato, prossimo + 1));        // la slide che arriverà dopo si prepara in anticipo
    sveglia = setTimeout(aggiorna, Math.max(0, prossimo - ora()));
  }
  scriviProva();
}

function scriviProva() {
  if (!PROVA) return;
  provaEl.textContent = (deck ? '«' + deck.titolo + '» slide ' + (mostrata + 1) + '/' + deck.n : 'nessuna presentazione') + ' · ' +
    (stato && stato.deck ? (stato.modo === 'auto' ? 'automatico ' + stato.durata + ' s' : 'a mano') : 'in attesa') +
    ' · ' + (RETE.collegato() ? 'collegato' : 'NON collegato') + ' · orologio ' + Math.round(scarto) + ' ms';
}

var ultimoVivo = 0;
function vivo() {           // ogni schermo dice ogni tanto che è acceso: il telecomando conta quanti sono
  if (RETE.manda({ k: 'vivo', ruolo: 'monitor', slide: mostrata, deck: deck ? deck.id : '' }, 'vivo', false)) ultimoVivo = Date.now();
}
setInterval(function () { if (Date.now() - ultimoVivo > 20000) vivo(); scriviProva(); }, 5000);

RETE.ascolta(function (m) {
  // un telecomando appena aperto chiede chi è acceso: si risponde in un momento a caso dei 2 secondi successivi,
  // così 40 schermi non rispondono tutti nello stesso istante
  if (m.k === 'chi') { setTimeout(vivo, Math.random() * 2000); return; }
  if (m.k !== 'stato') return;
  if (stato && m.rev <= stato.rev) return;               // una copia vecchia arrivata in ritardo da un altro server
  stato = m; aggiorna();
});

aggiorna();
RETE.collega();
sincronizza().then(aggiorna);
setInterval(function () { sincronizza().then(aggiorna); }, 10 * 60 * 1000);
</script>
</body>
</html>
